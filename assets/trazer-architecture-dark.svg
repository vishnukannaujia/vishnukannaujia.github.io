<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 516" width="880" height="516" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Trazer architecture</title><desc>Mic, VAD, speech-to-text, orchestrator, TTS and speaker form a real-time loop; the orchestrator delegates to background subagents through a task registry and speaks their results.</desc>
<rect x="0.5" y="0.5" width="879" height="515" rx="12" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#898781"/></marker></defs><text x="40" y="52" font-size="22" font-weight="650" fill="#ffffff" text-anchor="start">The conversation never waits for the work</text><text x="40" y="78" font-size="14" font-weight="400" fill="#c3c2b7" text-anchor="start">Trazer keeps listening while background subagents do the task</text><text x="40" y="112" font-size="11" font-weight="600" fill="#898781" text-anchor="start">CONVERSATION LOOP · real time, runs locally</text><rect x="40" y="156" width="90" height="60" rx="8" fill="#242422" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="85" y="183" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Mic</text><text x="85" y="202" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">always on</text><rect x="170" y="156" width="90" height="60" rx="8" fill="#242422" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="215" y="183" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">VAD</text><text x="215" y="202" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">Silero</text><rect x="300" y="156" width="122" height="60" rx="8" fill="#242422" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="361" y="183" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Speech to text</text><text x="361" y="202" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">faster-whisper</text><rect x="462" y="156" width="138" height="60" rx="8" fill="#16283f" stroke="#3987e5" stroke-width="1.5"/><text x="531" y="183" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Orchestrator</text><text x="531" y="202" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">LLM · ack + delegate</text><rect x="640" y="156" width="90" height="60" rx="8" fill="#242422" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="685" y="183" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">TTS</text><text x="685" y="202" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">Piper</text><rect x="770" y="156" width="70" height="60" rx="8" fill="#242422" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="805" y="191" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Speaker</text><path d="M130,186H167" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><path d="M260,186H297" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><path d="M422,186H459" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><path d="M600,186H637" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><path d="M730,186H767" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><path d="M215,156V142a8,8 0 0 1 8,-8H797a8,8 0 0 1 8,8V153" fill="none" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="791" y="126" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="end">barge-in: speech cuts playback</text><text x="40" y="272" font-size="11" font-weight="600" fill="#898781" text-anchor="start">WORK LOOP · background</text><path d="M507,216V277" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><path d="M555,280V219" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><text x="497" y="254" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="end">spawn / cancel</text><text x="565" y="254" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">spoken updates</text><rect x="421" y="280" width="220" height="50" rx="8" fill="#242422" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="531" y="310" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Task registry</text><rect x="239" y="370" width="104" height="44" rx="8" fill="#242422" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="291" y="397" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">web</text><path d="M531,330V350H291V367" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><rect x="359" y="370" width="104" height="44" rx="8" fill="#242422" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="411" y="397" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">files</text><path d="M531,330V350H411V367" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><rect x="479" y="370" width="104" height="44" rx="8" fill="#242422" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="531" y="397" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">calendar</text><path d="M531,330V350H531V367" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><rect x="599" y="370" width="104" height="44" rx="8" fill="#242422" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="651" y="397" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">research</text><path d="M531,330V350H651V367" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><rect x="719" y="370" width="104" height="44" rx="8" fill="#242422" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="771" y="397" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">agent</text><path d="M531,330V350H771V367" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><text x="225" y="397" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="end">subagents</text><line x1="40" y1="440" x2="840" y2="440" stroke="#2c2c2a"/><text x="40" y="468" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">Feedback</text><text x="118" y="468" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">corrections → reflection → evidence-weighted learnings.json → next prompt</text><text x="40" y="492" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">Tracing</text><text x="118" y="492" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">every LLM call logged locally, correlated by session across the whole delegate chain</text>
</svg>
