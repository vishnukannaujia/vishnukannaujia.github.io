<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 366" width="880" height="366" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>f1-fantasy: embedding model bakeoff</title><desc>recall@1: all-MiniLM-L6-v2 53%, all-mpnet-base-v2 80%, bge-large-en-v1.5 93% (chosen).</desc>
<rect x="0.5" y="0.5" width="879" height="365" rx="12" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
<text x="40" y="52" font-size="22" font-weight="650" fill="#ffffff" text-anchor="start">Picking the embedding model by measurement</text><text x="40" y="78" font-size="14" font-weight="400" fill="#c3c2b7" text-anchor="start">recall@1 on 15 hand-labelled questions, chunking held constant</text><line x1="300" y1="108" x2="300" y2="282" stroke="#383835" stroke-width="1"/><text x="300" y="302" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">0%</text><line x1="420" y1="108" x2="420" y2="282" stroke="#2c2c2a" stroke-width="1"/><text x="420" y="302" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">25%</text><line x1="540" y1="108" x2="540" y2="282" stroke="#2c2c2a" stroke-width="1"/><text x="540" y="302" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">50%</text><line x1="660" y1="108" x2="660" y2="282" stroke="#2c2c2a" stroke-width="1"/><text x="660" y="302" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">75%</text><line x1="780" y1="108" x2="780" y2="282" stroke="#2c2c2a" stroke-width="1"/><text x="780" y="302" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">100%</text><text x="40" y="135" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">all-MiniLM-L6-v2</text><text x="40" y="153" font-size="12" font-weight="400" fill="#898781" text-anchor="start">384 dims · symmetric</text><path d="M300,125h250.4a4,4 0 0 1 4,4v16a4,4 0 0 1 -4,4h-250.4z" fill="#4a4a46"/><text x="562.4" y="142" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">53%</text><text x="40" y="193" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">all-mpnet-base-v2</text><text x="40" y="211" font-size="12" font-weight="400" fill="#898781" text-anchor="start">768 dims · symmetric</text><path d="M300,183h380a4,4 0 0 1 4,4v16a4,4 0 0 1 -4,4h-380z" fill="#4a4a46"/><text x="692" y="200" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">80%</text><text x="40" y="251" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">bge-large-en-v1.5</text><text x="40" y="269" font-size="12" font-weight="400" fill="#898781" text-anchor="start">1024 dims · retrieval-tuned · chosen</text><path d="M300,241h442.40000000000003a4,4 0 0 1 4,4v16a4,4 0 0 1 -4,4h-442.40000000000003z" fill="#3987e5"/><text x="754.4000000000001" y="258" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">93%</text><text x="40" y="342" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">A cross-encoder reranker was tested the same way and rejected: recall@1 fell from 14/15 to 13/15.</text>
</svg>
