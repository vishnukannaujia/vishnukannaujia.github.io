<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>f1-fantasy: team-builder graph</title><desc>load_static_context, fetch_live_conditions, propose_team, validate_budget, then finalize; an invalid proposal loops back to propose_team up to twice.</desc>
<rect x="0.5" y="0.5" width="879" height="329" rx="12" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#898781"/></marker></defs><text x="40" y="52" font-size="22" font-weight="650" fill="#ffffff" text-anchor="start">A hard budget is checked by code, not by the model</text><text x="40" y="78" font-size="14" font-weight="400" fill="#c3c2b7" text-anchor="start">The team-builder graph: the LLM proposes, deterministic Python validates, and failures loop back</text><rect x="40" y="128" width="160" height="64" rx="8" fill="#242422" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="120" y="157" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">load_static_context</text><text x="120" y="176" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">full price tables</text><rect x="222" y="128" width="176" height="64" rx="8" fill="#242422" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="310" y="157" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">fetch_live_conditions</text><text x="310" y="176" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">web search, untrusted</text><rect x="420" y="128" width="140" height="64" rx="8" fill="#242422" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="490" y="157" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">propose_team</text><text x="490" y="176" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">LLM picks 5 + 2</text><rect x="582" y="128" width="150" height="64" rx="8" fill="#16283f" stroke="#3987e5" stroke-width="1.5"/><text x="657" y="157" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">validate_budget</text><text x="657" y="176" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">pure Python, $100M cap</text><rect x="754" y="128" width="86" height="64" rx="8" fill="#242422" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="797" y="165" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">finalize</text><path d="M200,160H219" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><path d="M398,160H417" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><path d="M560,160H579" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><path d="M732,160H751" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/><text x="743" y="118" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">valid</text><path d="M657,192V230a8,8 0 0 1 -8,8H498a8,8 0 0 1 -8,-8V195" fill="none" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="573.5" y="258" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">invalid: retry with the exact errors, up to 2 times</text><text x="40" y="306" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Catches over-budget teams, wrong roster sizes, unknown driver names and a captain outside the roster.</text>
</svg>
