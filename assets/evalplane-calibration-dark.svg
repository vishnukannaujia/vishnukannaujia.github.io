<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Evalplane: consent calibration curve on τ²-bench</title><desc>Violation rate among solved runs under three readings of one confirmation rule. Retail: 0.8%, 4.2%, 27.8%. Airline: 0.2%, 3.7%, 13.9%.</desc>
<rect x="0.5" y="0.5" width="879" height="469" rx="12" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
<text x="40" y="52" font-size="22" font-weight="650" fill="#ffffff" text-anchor="start">One policy sentence, three defensible readings</text><text x="40" y="78" font-size="14" font-weight="400" fill="#c3c2b7" text-anchor="start">Share of τ²-bench runs scored as solved that still broke “confirm before acting”</text><rect x="40" y="100" width="12" height="12" rx="3" fill="#3987e5"/><text x="58" y="111" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Retail</text><rect x="112" y="100" width="12" height="12" rx="3" fill="#d95926"/><text x="130" y="111" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Airline</text><line x1="330" y1="140" x2="330" y2="392" stroke="#383835" stroke-width="1"/><text x="330" y="412" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">0%</text><line x1="486.66666666666663" y1="140" x2="486.66666666666663" y2="392" stroke="#2c2c2a" stroke-width="1"/><text x="486.66666666666663" y="412" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">10%</text><line x1="643.3333333333333" y1="140" x2="643.3333333333333" y2="392" stroke="#2c2c2a" stroke-width="1"/><text x="643.3333333333333" y="412" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">20%</text><line x1="800" y1="140" x2="800" y2="392" stroke="#2c2c2a" stroke-width="1"/><text x="800" y="412" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">30%</text><text x="40" y="170" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">One yes covers the rest</text><text x="40" y="188" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">of the conversation</text><text x="40" y="208" font-size="12" font-weight="400" fill="#898781" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">llmcontract-tau2</text><path d="M330,154h8.533333333333335a4,4 0 0 1 4,4v14a4,4 0 0 1 -4,4h-8.533333333333335z" fill="#3987e5"/><text x="350.53333333333336" y="170" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">0.8%</text><path d="M330,178h0a3.1333333333333337,3.1333333333333337 0 0 1 3.1333333333333337,3.1333333333333337v15.733333333333333a3.1333333333333337,3.1333333333333337 0 0 1 -3.1333333333333337,3.1333333333333337h0z" fill="#d95926"/><text x="341.1333333333333" y="194" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">0.2%</text><text x="40" y="254" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">One yes lasts until the</text><text x="40" y="272" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">customer speaks again</text><text x="40" y="292" font-size="12" font-weight="400" fill="#898781" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Evalplane default</text><path d="M330,238h61.80000000000001a4,4 0 0 1 4,4v14a4,4 0 0 1 -4,4h-61.80000000000001z" fill="#3987e5"/><text x="403.8" y="254" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">4.2%</text><path d="M330,262h53.96666666666667a4,4 0 0 1 4,4v14a4,4 0 0 1 -4,4h-53.96666666666667z" fill="#d95926"/><text x="395.9666666666667" y="278" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">3.7%</text><text x="40" y="338" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">One yes per action</text><text x="40" y="358" font-size="12" font-weight="400" fill="#898781" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">each: true</text><path d="M330,322h431.5333333333333a4,4 0 0 1 4,4v14a4,4 0 0 1 -4,4h-431.5333333333333z" fill="#3987e5"/><text x="773.5333333333333" y="338" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">27.8%</text><path d="M330,346h213.76666666666665a4,4 0 0 1 4,4v14a4,4 0 0 1 -4,4h-213.76666666666665z" fill="#d95926"/><text x="555.7666666666667" y="362" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">13.9%</text><text x="40" y="442" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Same trajectories, same rule, same tool sets. Only how long a “yes” lasts changes: a 35× spread in retail, 70× in airline.</text>
</svg>
